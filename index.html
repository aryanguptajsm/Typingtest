<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Typing Test</title>   
     <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="container">
        <h1>Typing Speed Test</h1>
        
        <!-- The reference text will be injected here -->
        <div id="text">Click "Start" to begin the typing test...</div>
        
        <textarea id="input" placeholder="Start typing here..." disabled></textarea>
        
        <div class="info">
            <p>Time Left: <span id="time">0</span>s</p>
            <p>WPM: <span id="wpm">0</span></p>
            <p>Mistakes: <span id="mistakes">0</span></p>
            <p>Accuracy: <span id="accuracy">100</span>%</p>
        </div>
        
        <div class="buttons">
            <button id="start">Start</button>
            <button id="restart" disabled>Restart</button>
        </div>
        
        <div id="result"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
